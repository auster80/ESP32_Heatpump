[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibber-heatpump-bridge"
version = "0.1.0"
description = "Drive a heat pump from Tibber spot prices via SG Ready, Modbus, MQTT or HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
modbus = ["pymodbus>=3.6"]
mqtt = ["paho-mqtt>=1.6"]
gpio = ["gpiozero>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tibber-heatpump-bridge = "tibber_heatpump_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["tibber_heatpump_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
